<meta name="theme-color" content="#12263a">
<meta name="application-name" content="RentPilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#edf0f3;--sf:#fff;--ink:#14212e;--mu:#5b6b7b;--ln:#d3dae1;--hd:#12263a;--pri:#1f5f99;--ok:#1d8049;--wa:#b86a00;--er:#c0392b;--in:#2766b0;--gy:#6b7886;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--sf:#16212d;--ink:#e5ecf2;--mu:#93a4b5;--ln:#2a3a4b;--hd:#0a121b;--pri:#6fb0ee;--ok:#47c27c;--wa:#f0a23a;--er:#f0705f;--in:#6fa8ef;--gy:#8d9bab}}
:root[data-theme="dark"]{--bg:#0e1620;--sf:#16212d;--ink:#e5ecf2;--mu:#93a4b5;--ln:#2a3a4b;--hd:#0a121b;--pri:#6fb0ee;--ok:#47c27c;--wa:#f0a23a;--er:#f0705f;--in:#6fa8ef;--gy:#8d9bab}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Barlow,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hd{background:var(--hd);color:#fff;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hd h1{font:700 26px/1 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.3px}.hd small{color:#9fb3c6;display:block;font-size:13px;margin-top:3px}
.hd .sp{flex:1}
.btn{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--pri)}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{filter:brightness(1.1)}
.hd .btn{background:#ffffff14;border-color:#ffffff30;color:#fff}.hd .btn.p{background:#2f7fc6;border-color:#2f7fc6}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.kp{display:flex;gap:10px;padding:14px 20px 4px;overflow-x:auto}
.k{flex:0 0 auto;min-width:118px;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:6px;padding:8px 12px;text-align:left;cursor:pointer}
.k b{display:block;font:700 30px/1 'Barlow Condensed',sans-serif;color:var(--c)}.k span{font-size:13px;color:var(--mu)}
.k.on{outline:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--sf))}
.tb{display:flex;gap:8px;padding:10px 20px;flex-wrap:wrap;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tb input[type=search]{flex:1 1 240px;min-width:180px}
.tb input,.tb select{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 10px}
.seg{display:flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0}.seg .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#cnt{color:var(--mu);font-size:13px;padding:0 20px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding:0 20px 30px}
.card{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--sc,var(--gy));border-radius:6px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--pri);border-left-color:var(--sc)}
.card header{display:flex;justify-content:space-between;align-items:center}.card header b{font:700 17px 'Barlow Condensed',sans-serif;color:var(--mu);letter-spacing:.4px}
.card h3{margin:0;font:600 20px/1.15 'Barlow Condensed',sans-serif}.sub{margin:0;color:var(--mu);font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.r{--c:var(--er)}.a{--c:var(--wa)}.b{--c:var(--in)}.g{--c:var(--gy)}.ok{--c:var(--ok)}
.m{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:4px 0;padding:6px 0;border-block:1px dashed var(--ln)}
.m div{font-size:14px}.m span{display:block;font-size:12px;color:var(--mu)}.m .bw{color:var(--pri);font-weight:600}
.br{display:grid;grid-template-columns:78px 1fr 112px;gap:8px;align-items:center;font-size:12.5px;color:var(--mu)}
.br i{position:relative;height:8px;background:var(--bg);border-radius:4px;overflow:visible}.br i b{display:block;height:100%;border-radius:4px;background:var(--c)}
.br i u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}.br em{font-style:normal;color:var(--ink);text-align:right;font-weight:500}
.fl{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.rp{background:color-mix(in srgb,var(--wa) 13%,transparent);border-radius:4px;padding:4px 8px;font-size:13.5px}
.lc{font-size:13.5px;color:var(--mu);border-left:3px solid var(--ln);padding-left:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:auto}.ft b{color:var(--ink);font:600 16px 'Barlow Condensed',sans-serif}
.tw{overflow-x:auto;margin:0 20px 30px;border:1px solid var(--ln);border-radius:6px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{background:var(--bg);font-weight:600;color:var(--mu);position:sticky;top:0}tbody tr{cursor:pointer}tbody tr:hover{background:color-mix(in srgb,var(--pri) 8%,var(--sf))}
.empty{padding:40px 20px;text-align:center;color:var(--mu)}
#dr{position:fixed;inset:0;background:#0007;z-index:20;display:flex;justify-content:flex-end}#dr[hidden]{display:none}
#dr aside{width:min(560px,100%);height:100%;background:var(--sf);overflow-y:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
#dr h2{margin:0 0 10px;font:700 24px 'Barlow Condensed',sans-serif}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fm label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mu);gap:3px}.fm .w{grid-column:1/-1}
.fm input,.fm select,#nc{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;color:var(--ink);width:100%}
.fm input[type=checkbox]{width:auto;align-self:flex-start}
h4{margin:20px 0 8px;font:600 18px 'Barlow Condensed',sans-serif}
.cm{border-left:3px solid var(--pri);padding:2px 0 2px 10px;margin:0 0 10px}.cm time{font-size:12.5px;color:var(--mu);display:flex;justify-content:space-between}.cm p{margin:2px 0;white-space:pre-wrap}
.cm button{background:none;border:0;color:var(--mu);cursor:pointer}
@media(max-width:560px){.fm{grid-template-columns:1fr}.hd,.kp,.tb,#cnt{padding-inline:12px}.grid{padding-inline:12px}.tw{margin-inline:12px}}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 16px;border-radius:8px;z-index:40;max-width:90%;box-shadow:0 4px 16px #0005}#ts[hidden]{display:none}
a.btn{text-decoration:none;display:inline-block}#sv.w{color:#ffc266;font-weight:600}
.lg{background:#fff;border-radius:10px;padding:8px 18px;display:flex;gap:22px;align-items:center}.lg img{height:50px;width:auto;display:block}
.m{grid-template-columns:repeat(6,1fr)!important}.m div{grid-column:span 2}.m div:nth-child(-n+2){grid-column:span 3}
.tk{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:14px}.tk span{flex:1;min-width:0;overflow-wrap:anywhere}.tk em{font-style:normal;color:var(--mu);font-size:12.5px;white-space:nowrap}.tk em.r{color:var(--er);font-weight:600}
.tk .dn{text-decoration:line-through;color:var(--mu)}.tk button{background:none;border:0;color:var(--mu);cursor:pointer}.tk input[type=checkbox]{width:18px;height:18px;flex:none}
.card .tk{padding:1px 0;font-size:13.5px}.tv{padding:0 20px 30px;max-width:900px}.tr{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px 12px;margin-bottom:6px;cursor:pointer}.tr .loc{color:var(--pri);font-size:13px;font-weight:600}.tv h4{color:var(--c)}
.tka{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tka input{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;color:var(--ink)}#nt{flex:1 1 200px}
.fo{color:var(--pri);font-weight:600;text-decoration:none}.fo:hover{text-decoration:underline}
@media(max-width:560px){.lg{padding:6px 12px;gap:14px}.lg img{height:34px}}
